<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Yantrik OS Podman</title>
  <desc id="desc">A flat geometric container cube framing an agentic OS desktop window and terminal prompt.</desc>
  <rect width="96" height="96" rx="22" fill="#0F172A"/>
  <!-- Outer container frame (Podman / QEMU) -->
  <rect x="14" y="16" width="68" height="64" rx="12" fill="#1E293B" stroke="#8B5CF6" stroke-width="3.5"/>
  <!-- Window top bar -->
  <path d="M14 28a12 12 0 0 1 12-12h44a12 12 0 0 1 12 12v4H14Z" fill="#334155"/>
  <circle cx="24" cy="24" r="2.5" fill="#F43F5E"/>
  <circle cx="32" cy="24" r="2.5" fill="#F59E0B"/>
  <circle cx="40" cy="24" r="2.5" fill="#10B981"/>
  <!-- Agentic OS Y-node and terminal glyph -->
  <path d="M27 45 36 53 27 61" fill="none" stroke="#38BDF8" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
  <path d="M42 61h12" fill="none" stroke="#38BDF8" stroke-linecap="round" stroke-width="4"/>
  <!-- Surface Protocol / Mind node -->
  <circle cx="64" cy="46" r="6" fill="#A855F7"/>
  <circle cx="56" cy="62" r="4.5" fill="#2DD4BF"/>
  <circle cx="71" cy="62" r="4.5" fill="#2DD4BF"/>
  <path d="M61 51 57.5 58M67 51l2.5 7" fill="none" stroke="#E2E8F0" stroke-linecap="round" stroke-width="2.5"/>
</svg>

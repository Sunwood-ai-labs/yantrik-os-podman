<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Yantrik OS Podman Architecture on Windows 11 + WSL2</title>
  <desc id="arch-desc">Flow diagram from Windows 11 host and browser through WSL2 Podman Machine and KVM to qemux/qemu container running Yantrik OS with UEFI and yos Surface Protocol.</desc>
  <rect width="920" height="300" rx="16" fill="#0B1120"/>
  <!-- Box 1: Windows 11 Host -->
  <rect x="24" y="36" width="240" height="228" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <text x="44" y="68" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Windows 11 Host</text>
  <rect x="44" y="88" width="200" height="64" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="114" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600">Web Browser (noVNC)</text>
  <text x="60" y="136" fill="#94A3B8" font-family="Consolas, monospace" font-size="12">http://127.0.0.1:8006</text>
  <rect x="44" y="170" width="200" height="72" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="196" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600">PowerShell Launcher</text>
  <text x="60" y="216" fill="#94A3B8" font-family="Consolas, monospace" font-size="12">./yantrik-podman.ps1</text>
  <text x="60" y="232" fill="#94A3B8" font-family="Consolas, monospace" font-size="12">./scripts/download-iso.ps1</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M264 120H324" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
  <polygon points="324,115 334,120 324,125" fill="#38BDF8"/>
  <path d="M264 206H324" fill="none" stroke="#8B5CF6" stroke-width="2.5"/>
  <polygon points="324,201 334,206 324,211" fill="#8B5CF6"/>

  <!-- Box 2: WSL2 Podman Machine -->
  <rect x="336" y="36" width="256" height="228" rx="12" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>
  <text x="356" y="68" fill="#C084FC" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">WSL2 Podman Machine</text>
  <rect x="356" y="88" width="216" height="64" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="372" y="114" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600">Nested KVM Acceleration</text>
  <text x="372" y="136" fill="#94A3B8" font-family="Consolas, monospace" font-size="12">/dev/kvm (kvm_intel / amd)</text>
  <rect x="356" y="170" width="216" height="72" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="372" y="196" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600">Podman Compose</text>
  <text x="372" y="216" fill="#94A3B8" font-family="Consolas, monospace" font-size="12">./yantrik.iso -&gt; /boot.iso</text>
  <text x="372" y="232" fill="#94A3B8" font-family="Consolas, monospace" font-size="12">yantrik-data  -&gt; /storage</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M592 150H652" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
  <polygon points="652,145 662,150 652,155" fill="#2DD4BF"/>

  <!-- Box 3: qemux/qemu Container + Yantrik OS -->
  <rect x="664" y="36" width="232" height="228" rx="12" fill="#1E293B" stroke="#2DD4BF" stroke-width="2"/>
  <text x="684" y="68" fill="#2DD4BF" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">qemux/qemu Container</text>
  <rect x="684" y="88" width="192" height="64" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="700" y="114" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600">QEMU 10.2 + OVMF</text>
  <text x="700" y="136" fill="#94A3B8" font-family="Consolas, monospace" font-size="12">BOOT_MODE=uefi / 8G / 4C</text>
  <rect x="684" y="170" width="192" height="72" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="700" y="196" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600">Yantrik OS (Debian 13)</text>
  <text x="700" y="216" fill="#94A3B8" font-family="Consolas, monospace" font-size="12">33 Native Apps + Harnesses</text>
  <text x="700" y="232" fill="#94A3B8" font-family="Consolas, monospace" font-size="12">yos Surface Protocol CLI</text>
</svg>
